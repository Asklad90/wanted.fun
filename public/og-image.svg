<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background pattern -->
    <pattern id="dot-grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#111111" fill-opacity="0.18" />
    </pattern>
    <filter id="shadow-hard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#111111" />
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- Cream base -->
  <rect width="1200" height="630" fill="#FFFDF0" />
  <!-- Dots -->
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Outer frame border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#111111" stroke-width="6" />

  <!-- Top pill badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="46" rx="23" fill="#FFFFFF" stroke="#111111" stroke-width="3" filter="url(#shadow-sm)" />
    <circle cx="24" cy="23" r="7" fill="#16A34A" />
    <text x="44" y="28" font-family="'Space Mono', monospace" font-size="15" font-weight="700" fill="#111111" letter-spacing="1">LIVE ON ARC · 100% ESCROW</text>
  </g>

  <!-- Main Brand Title Area -->
  <g transform="translate(80, 160)">
    <!-- WANT Badge -->
    <g transform="rotate(-6 120 70)">
      <rect x="0" y="10" width="240" height="100" rx="18" fill="#FF3E9A" stroke="#FFFFFF" stroke-width="6" filter="url(#shadow-hard)" />
      <text x="120" y="82" font-family="'Space Mono', monospace" font-size="64" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="6">WANT</text>
    </g>
    <!-- .fun text -->
    <text x="270" y="96" font-family="'Fredoka One', cursive, sans-serif" font-size="94" font-weight="900" fill="#A78BFA" stroke="#111111" stroke-width="6" paint-order="stroke fill">.fun</text>
  </g>

  <!-- Tagline & Description -->
  <text x="80" y="340" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="800" fill="#111111">
    Post a bounty. Get it done.
  </text>
  <text x="80" y="400" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="500" fill="#333333">
    Lock USDC in escrow, get work done onchain.
  </text>
  <text x="80" y="440" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="500" fill="#555555">
    The prize is guaranteed before a single worker types a word.
  </text>

  <!-- Stats / Tags cards at bottom right -->
  <g transform="translate(760, 360)">
    <rect x="0" y="0" width="360" height="180" rx="16" fill="#FFE600" stroke="#111111" stroke-width="4" filter="url(#shadow-hard)" />
    <text x="30" y="55" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#111111" letter-spacing="1">INSTANT REWARDS</text>
    <text x="30" y="105" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="#111111">USDC Onchain</text>
    <text x="30" y="145" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#111111">Verified by Smart Contract</text>
  </g>

  <!-- Bottom URL bar -->
  <g transform="translate(80, 525)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#7FF3F0" stroke="#111111" stroke-width="3" filter="url(#shadow-sm)" />
    <text x="110" y="27" font-family="'Space Mono', monospace" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">want.fun ↗</text>
  </g>
</svg>
